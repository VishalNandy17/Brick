version: '3.8'

services:
  ca.org1.brick.local:
    image: hyperledger/fabric-ca:latest
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_CA_CERTFILE=/etc/hyperledger/fabric-ca-server/ca.org1.brick.local-cert.pem
      - FABRIC_CA_SERVER_CA_KEYFILE=/etc/hyperledger/fabric-ca-server/ca.org1.brick.local-key.pem
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    volumes:
      - ./ca:/etc/hyperledger/fabric-ca-server
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    networks:
      - brick-network

  orderer.brick.local:
    image: hyperledger/fabric-orderer:latest
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./orderer:/var/hyperledger/orderer
    ports:
      - "7050:7050"
    networks:
      - brick-network

  peer0.org1.brick.local:
    image: hyperledger/fabric-peer:latest
    environment:
      - CORE_PEER_ID=peer0.org1.brick.local
      - CORE_PEER_ADDRESS=peer0.org1.brick.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_LOCALMSPDIR=/etc/hyperledger/msp/peerOrganizations/org1.brick.local/peers/peer0.org1.brick.local/msp
      - CORE_PEER_TLS_ENABLED=false
      - CORE_CHAINCODE_LOGGING_LEVEL=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=brick-network
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./peers:/etc/hyperledger/msp
    ports:
      - "7051:7051"
      - "7053:7053"
    depends_on:
      - orderer.brick.local
    networks:
      - brick-network

  peer1.org1.brick.local:
    image: hyperledger/fabric-peer:latest
    environment:
      - CORE_PEER_ID=peer1.org1.brick.local
      - CORE_PEER_ADDRESS=peer1.org1.brick.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_LOCALMSPDIR=/etc/hyperledger/msp/peerOrganizations/org1.brick.local/peers/peer1.org1.brick.local/msp
      - CORE_PEER_TLS_ENABLED=false
      - CORE_CHAINCODE_LOGGING_LEVEL=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=brick-network
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./peers:/etc/hyperledger/msp
    ports:
      - "7061:7051"
      - "7063:7053"
    depends_on:
      - orderer.brick.local
    networks:
      - brick-network

  couchdb.org1:
    image: couchdb:3.2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=admin
    ports:
      - "5984:5984"
    networks:
      - brick-network

networks:
  brick-network:
    driver: bridge
